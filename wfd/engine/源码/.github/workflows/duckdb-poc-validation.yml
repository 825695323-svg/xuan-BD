name: WFD DuckDB engine POC validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'wfd_sdk/**'
      - 'tests/**'
      - 'scripts/**'
      - 'run_duckdb_demo.py'
      - 'requirements-duckdb.txt'
      - '.github/workflows/duckdb-poc-validation.yml'
jobs:
  engine-validation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install official DuckDB and test dependencies
        run: python -m pip install -r requirements-duckdb.txt
      - name: Run official engine and snapshot verification
        run: python scripts/verify_engine.py
      - name: Upload test report and sandbox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wfd-duckdb-${{ matrix.os }}
          path: |
            results/duckdb_engine_validation.json
            results/demo_results.json
            results/store_demo/
          if-no-files-found: warn
