name: Temporary BD publication-set integration
on:
  pull_request:
    paths:
      - '.github/workflows/bd-set-integration.yml'
permissions:
  contents: write
jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feat/bd-r1-output-review'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_HEAD: ${{ github.event.pull_request.head.sha }}
      XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/r
      XUAN_TEST_ROOT: ${{ runner.temp }}/r-tests
      XUAN_REVIEW_VISUAL_ROOT: ${{ runner.temp }}/bd-set-visual
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Apply checksum-bound source increment and remove temporary workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          repo='825695323-svg/xuan-BD'
          assert os.environ['GITHUB_REPOSITORY']==repo
          base='f6760b7339e8e802f21f1886550c5122c4cf470d'
          subprocess.run(['git','fetch','--no-tags','origin',base,'--depth=1'],check=True)
          changed=subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()
          temporary={'.github/workflows/bd-integration-input.yml','.github/workflows/bd-set-integration.yml'}
          assert set(changed)<=temporary,changed
          parts=['dd1ff1180d90d5495e3d65825a5f011dff92e232','03d729161a04a8bb7515563a0364994a8efee1d7','8430226eb0ecb6508b89a249c674422879748945','8cbd6c5026ab59dc1e5c785405c9a8761b3fc6b4','d72d780fd30e2f0c04702b321720ced64d2f8fff']
          data=b''
          for sha in parts:
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/blobs/{sha}',headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response: value=json.load(response)
              raw=base64.b64decode(value['content'])
              assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()==sha
              data+=raw
          assert hashlib.sha256(data).hexdigest()=='7818dc44ec0084cf1077aecf15ef0bcd803a09318c98154d99dc4bad42326b94'
          patch=lzma.decompress(data)
          assert hashlib.sha256(patch).hexdigest()=='e2c3f8c9d26b692acfc3e8f6bab9d5b519c7d3a3bd8b75a655a001a279af3e1a'
          path=pathlib.Path(os.environ['RUNNER_TEMP'])/'bd-set.patch'
          path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--index',str(path)],check=True)
          subprocess.run(['git','apply','--index',str(path)],check=True)
          subprocess.run(['git','rm',*sorted(temporary)],check=True)
          print('SET_SOURCE_PATCH_VERIFIED',hashlib.sha256(patch).hexdigest())
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked install, source check and production build
        run: |
          npm ci
          npm run repo:check
          npm run build
      - name: Prepare isolated database and browser
        run: |
          python -m pip install -r wfd/product/requirements-duckdb.txt
          echo "WFD_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$chrome"
          chrome="$(readlink -f "$chrome")"
          sha256sum "$chrome"
          launcher="$RUNNER_TEMP/bd-set-chrome"
          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox --disable-dev-shm-usage "$@"\n' "$chrome" > "$launcher"
          chmod 700 "$launcher"
          echo "XUAN_TEST_BROWSER=$launcher" >> "$GITHUB_ENV"
          echo "XUAN_TEST_BROWSER_SHA256=$(sha256sum "$launcher" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          mkdir -p "$XUAN_FULL_CHAIN_ROOT" "$XUAN_TEST_ROOT" "$XUAN_REVIEW_VISUAL_ROOT"
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fc-cache -f
      - name: Actual set confirmation, HTTP WFD recovery and browser verification
        run: |
          node --import tsx --test apps/web/src/ui/r1-plan-review.test.ts apps/server/r1-plan-review-http.test.ts
      - name: Affected quality and request acceptance contracts
        run: |
          node --import tsx --test modules/collection/processing-quality.test.ts modules/collection/processing-plan-request.test.ts apps/server/processing-quality.test.ts
      - name: WFD publication-set and duplicate-append regression only
        env:
          PYTHONPATH: wfd/product:wfd/product/tests
        run: python -m pytest -q -p no:cacheprovider wfd/product/tests/test_publication_sets.py wfd/product/tests/test_duplicate_append.py
      - name: Export verified source objects, never update a branch or commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,json,os,pathlib,subprocess,urllib.request
          repo='825695323-svg/xuan-BD'
          assert os.environ['GITHUB_REPOSITORY']==repo
          head=os.environ['SOURCE_HEAD']
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==head
          subprocess.run(['git','diff','--exit-code'],check=True)
          expected={'.github/workflows/bd-ui-source-unification.yml','apps/server/r1-plan-review-http.test.ts','apps/web/src/r1-api.ts','apps/web/src/r1-plan-review.ts','apps/web/src/ui/R1PlanReviewPanel.tsx','apps/web/src/ui/R1SingleOutputPanel.tsx','apps/web/src/ui/r1-plan-review.test.ts','contracts/r1-contracts.ts','contracts/r1-publication-set.ts','docs/SOURCE-SEMANTIC-ADOPTION.md','modules/collection/processing-plan.ts','modules/collection/r1-paged-readback.ts','modules/collection/r1-structured-handoff.ts','modules/collection/r1-workspace.ts','wfd/product/tests/test_publication_sets.py','wfd/product/wfd_sdk/product_data_service.py','.github/workflows/bd-integration-input.yml','.github/workflows/bd-set-integration.yml'}
          paths=subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines()
          assert set(paths)==expected,paths
          def api(route,payload=None):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/'+route,data=None if payload is None else json.dumps(payload).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='GET' if payload is None else 'POST')
              with urllib.request.urlopen(req,timeout=60) as response: return json.load(response)
          base=api('git/commits/'+head)['tree']['sha']
          entries=[]
          for path in paths:
              file=pathlib.Path(path)
              sha=None
              if file.exists():
                  assert file.is_file() and not file.is_symlink()
                  raw=file.read_bytes()
                  sha=api('git/blobs',{'content':base64.b64encode(raw).decode(),'encoding':'base64'})['sha']
                  assert sha==subprocess.check_output(['git','hash-object',path],text=True).strip()
              entries.append({'path':path,'mode':'100644','type':'blob','sha':sha})
          tree=api('git/trees',{'base_tree':base,'tree':entries})['sha']
          report={'head':head,'tree':tree,'files':entries,'run_id':os.environ['GITHUB_RUN_ID'],'patch_sha256':'e2c3f8c9d26b692acfc3e8f6bab9d5b519c7d3a3bd8b75a655a001a279af3e1a','scope':'locked build; set browser/HTTP/WFD; targeted quality/request/duplicate tests; full Linux regression not run'}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'bd-set-tested-tree.json').write_text(json.dumps(report,indent=2))
          print('TESTED_TREE',tree,'PARENT',head)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bd-set-tested-tree
          path: ${{ runner.temp }}/bd-set-tested-tree.json
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bd-set-integration-visual
          path: ${{ runner.temp }}/bd-set-visual/
          if-no-files-found: warn
          retention-days: 7
