name: BD unified algorithm entry - migration gate

on:
  push:
    branches: [refactor/unified-algorithm-entry]
  pull_request:
    paths:
      - 'modules/financial/**'
      - 'modules/collection/fixed-calculation-service.ts'
      - 'contracts/fixed-calculation-contracts.ts'
      - '.github/workflows/bd-unified-algorithms.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Unified catalogue and old-task compatibility
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/bd-algorithm-unify
        run: |
          mkdir -p "$XUAN_TEST_ROOT"
          node --import tsx --test \
            modules/financial/unified-algorithm-entry.test.ts \
            modules/financial/basic-algorithm-tool-contract.test.ts
