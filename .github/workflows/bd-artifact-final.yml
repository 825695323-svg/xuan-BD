name: BD artifact project full regression (diagnostic)

on:
  push:
    branches:
      - codex/artifact-final-regression
  # 全仓诊断仅在明确运行时执行，避免没有随包资源的 GitHub 托管机
  # 把既有的资源依赖测试失败误当成每个普通 PR 的新回归。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - name: Typecheck and production frontend build
        run: npm run build
      - name: Run complete Node and TypeScript regression suite (reports real failures)
        env:
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/bd-artifact-final-chain
          XUAN_TEST_ROOT: ${{ runner.temp }}/bd-artifact-final-tests
        run: |
          mkdir -p "$XUAN_FULL_CHAIN_ROOT" "$XUAN_TEST_ROOT"
          npm test
