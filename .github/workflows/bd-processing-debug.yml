name: BD processing projection diagnostic

on:
  push:
    branches: [fix/processing-model-result-20261111]

permissions:
  contents: read

jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Run only synthetic failing processing cases with task error evidence
        env:
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/processing-diag-host
          XUAN_TEST_ROOT: ${{ runner.temp }}/processing-diag-files
          BD_DIAG_PROCESSING: '1'
        run: |
          mkdir -p "$XUAN_FULL_CHAIN_ROOT" "$XUAN_TEST_ROOT"
          node --import tsx --test \
            --test-name-pattern='processing dedicated formats|processing structure summary' \
            modules/collection/r1-conversation-bridge.test.ts
