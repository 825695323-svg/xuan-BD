name: BD custody verification

on:
  pull_request:
    paths:
      - '.github/workflows/bd-custody.yml'
      - 'modules/collection/**'
      - 'modules/agent/model-tools.ts'
      - 'platform/plugins/**'
      - 'apps/server/capabilities.ts'
      - 'platform/capabilities/browser/**'
      - 'platform/capabilities/transcription/**'
      - 'platform/capabilities/conversion/**'
      - 'plugins/capture-sources/index.ts'
      - 'plugins/storage/**'
      - 'plugins/capture-sources/baidu-drive/**'
      - 'apps/server/cloud-*.test.ts'
      - 'apps/web/src/ui/CloudCustodyPanel.tsx'
      - 'package*.json'
  push:
    branches:
      - codex/baidu-skill-metadata-archive
      - codex/unified-artifact-skill-archive
      - codex/artifact-restore-video-temp
      - codex/artifact-lifecycle-closeout
      - codex/candidate-retention-closeout
      - codex/source-artifact-manifest
      - fix/archify-wiring-20261111

permissions:
  contents: read

jobs:
  custody:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Focused Baidu custody and restoration tests
        env:
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/xuan-bd-full-chain
        run: |
          mkdir -p "$XUAN_FULL_CHAIN_ROOT"
          node --import tsx --test \
            platform/capabilities/browser/raw-page-dedup.test.ts \
            modules/collection/artifact-archive.test.ts \
            modules/collection/artifact-restore.test.ts \
            modules/collection/artifact-lifecycle.test.ts \
            modules/collection/candidate-reclaim.test.ts \
            modules/collection/artifact-manifest.test.ts \
            modules/collection/archify-wiring-regression.test.ts \
            modules/collection/cloud-custody.test.ts \
            modules/collection/baidu-drive-copy.test.ts \
            modules/collection/cloud-algorithm-evidence.test.ts \
            apps/server/cloud-custody.test.ts \
            apps/server/cloud-evidence.test.ts
