name: BD source recipe and clean rebuild

on:
  push:
    branches: [main, fix/bd-reproducible-recipe-20261112]
    paths: ['.github/workflows/bd-repository-recipe.yml', 'scripts/**', 'config/**', 'resources/browser/**', 'package*.json', 'README.md', 'docs/**', '.gitignore', '.gitattributes', 'AGENTS.md', 'LICENSE']
  pull_request:
    paths: ['.github/workflows/bd-repository-recipe.yml', 'scripts/**', 'config/**', 'resources/browser/**', 'package*.json', 'README.md', 'docs/**', '.gitignore', '.gitattributes', 'AGENTS.md', 'LICENSE', 'staging/**', 'wfd/product/**', 'apps/server/media-review*', 'apps/server/ocr-review*', 'apps/server/transcription-review*']
  workflow_dispatch:
    inputs:
      full_regression:
        description: 'Run the optional full Linux Node/Python regression'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
concurrency:
  group: bd-source-recipe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test downloader boundaries and build pinned toolchain
        shell: bash
        run: |
          python scripts/bootstrap-resources.test.py
          python scripts/bootstrap-resources.py --profile toolchain --output "$RUNNER_TEMP/bd-tools"
          python - <<'PY'
          import json,os,pathlib
          receipt=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'bd-tools/recipe-receipt.json').read_text())
          with open(os.environ['GITHUB_ENV'],'a') as env:
              for key,value in [('BD_NODE',receipt['node']),('BD_NPM',receipt['npmCli']),('BD_PYTHON',receipt['python'])]: env.write(key+'='+value+'\n')
          with open(os.environ['GITHUB_PATH'],'a') as path:path.write(str(pathlib.Path(receipt['node']).parent)+'\n')
          PY
      - name: Install locked dependencies and build source
        shell: bash
        run: |
          "$BD_NODE" "$BD_NPM" ci
          "$BD_NODE" "$BD_NPM" run repo:check
          "$BD_NODE" "$BD_NPM" run test:recipe
          "$BD_NODE" "$BD_NPM" run build
          "$BD_PYTHON" -m venv "$RUNNER_TEMP/bd-venv"
          python - <<'PY'
          import os,pathlib
          p=pathlib.Path(os.environ['RUNNER_TEMP'])/'bd-venv'/('Scripts/python.exe' if os.name=='nt' else 'bin/python')
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('WFD_PYTHON='+str(p)+'\n')
              env.write('XUAN_TEST_NPM_CLI='+os.environ['BD_NPM']+'\n')
          PY
      - name: Install hash-locked WFD and calculation requirements
        shell: bash
        run: |
          "$WFD_PYTHON" -m pip install --only-binary=:all: --require-hashes -r config/local-web-python.lock.txt -r config/polars.lock.txt
          echo "POLARS_PYTHON=$WFD_PYTHON" >> "$GITHUB_ENV"
      - name: Verify the isolated WFD data_only fixture publishes under its registered protocol
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PYTHONPATH=wfd/product:wfd/product/tests "$WFD_PYTHON" - <<'PY'
          import tempfile, json
          from pathlib import Path
          from test_r1_data_only import make_data_service, request, scalar_output
          with tempfile.TemporaryDirectory() as temp:
              result = make_data_service(Path(temp)).submit(
                  request([scalar_output('m1', 'r1.metric', '10')], 'fixture-inspect-only'))
              assert result['state'] == 'published_formal', json.dumps(result, ensure_ascii=False)
              print('WFD_DATA_ONLY_SMOKE_OK', json.dumps({
                  'state':result.get('state'),'errors':result.get('errors'),
                  'outputs':[{'key':r.get('output_key'),'state':r.get('registration_state'),
                  'errors':r.get('errors')} for r in result.get('output_results',[])]},
                  ensure_ascii=False))
          PY
      - name: Prepare and start isolated native application, preserve restart identity
        shell: bash
        run: |
          export XUAN_TEST_ROOT="$RUNNER_TEMP/bd-native-fixtures"
          mkdir -p "$XUAN_TEST_ROOT"
          python - <<'PYCFG'
          import json,os,pathlib,subprocess
          base=pathlib.Path(os.environ['RUNNER_TEMP']).resolve()
          proof=base/'bd-command-proof';proof.mkdir()
          node=os.environ['BD_NODE']
          config=proof/'local-web.json'
          subprocess.run([node,'scripts/create-local-config.mjs',
              '--toolchain='+str(base/'bd-tools'), '--python='+os.environ['WFD_PYTHON'],
              '--runtime-root='+str(proof/'runtime'), '--launcher='+str(proof/'launcher.json'),
              '--output='+str(config)],check=True)
          for command in ('check','prepare'):
              subprocess.run([node,'scripts/local-web.mjs',command,'--config='+str(config)],check=True)
          print('README_CONFIGURATION_COMMANDS_VERIFIED')
          PYCFG
          "$BD_NODE" --import tsx --test platform/resources/local-web.test.ts
      - name: Verify isolated Wave1 file I/O and structured WFD bundles on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "bdw1 文件"
          New-Item -ItemType Directory -Path $root | Out-Null
          $env:XUAN_TEST_ROOT = (New-Item -ItemType Directory -Path (Join-Path $root 'node')).FullName
          $env:XUAN_FULL_CHAIN_ROOT = (New-Item -ItemType Directory -Path (Join-Path $root 'wfd')).FullName
          $env:PYTHONDONTWRITEBYTECODE = '1'
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = '1'
          $env:PYTHONPATH = @((Join-Path $PWD 'wfd/product'), (Join-Path $PWD 'wfd/product/tests')) -join [IO.Path]::PathSeparator
          $drive = [IO.DriveInfo]::new([IO.Path]::GetPathRoot($root))
          Write-Host "Windows runner filesystem: $($drive.DriveFormat); disposable synthetic data only."
          function Invoke-BdTest([string[]]$Arguments) {
            $output = & $env:BD_NODE @Arguments
            $status = $LASTEXITCODE
            $output | Write-Host
            if ($status -ne 0 -or $output -notcontains '# fail 0' -or $output -notcontains '# skipped 0' -or -not ($output -match '^# tests [1-9][0-9]*$')) {
              throw 'The targeted Windows Node test did not pass without skips.'
            }
          }
          $nodeTest = @('--import', 'tsx', '--test', '--test-concurrency=1', '--test-reporter=tap')
          Invoke-BdTest ($nodeTest + 'platform/runtime/file-workspace.test.ts')
          Invoke-BdTest ($nodeTest + '--test-name-pattern=^HTTP full, delta and reference bundles' + 'apps/server/r1-bundle.test.ts')
          $pythonResult = & $env:WFD_PYTHON -m pytest -q --basetemp (Join-Path $root 'pytest-tmp') -p no:cacheprovider wfd/product/tests/test_product_bundle_r2b_structured.py::test_structured_full_synthetic_daily_field_subset_and_physical_scan
          $pythonStatus = $LASTEXITCODE
          $pythonResult | Write-Host
          if ($pythonStatus -ne 0 -or -not ($pythonResult -match '^1 passed in ')) {
            throw 'The targeted Windows structured WFD case did not execute and pass.'
          }
      - name: Verify WFD target identity and publication-guard regressions
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export PYTHONPATH=wfd/product:wfd/product/tests
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          export PYTHONDONTWRITEBYTECODE=1
          "$WFD_PYTHON" -m pytest -q --tb=short -p no:cacheprovider \
            wfd/product/tests/test_publication_sets.py \
            wfd/product/tests/test_joint_volume.py \
            wfd/product/tests/test_joint_governance.py \
            wfd/product/tests/test_joint_unsupported.py \
            wfd/product/tests/test_market_current_only.py::test_current_business_replacement_contracts_and_pinned_technical_read \
            wfd/product/tests/test_market_current_only.py::test_current_business_scope_is_explicit_and_ordinary_history_is_unchanged \
            wfd/product/tests/test_market_current_only.py::test_current_business_same_interval_cannot_enter_through_two_outputs \
            wfd/product/tests/test_p4b_registration_repair.py::test_registered_only_reuse_hydrates_definition_and_registry \
            wfd/product/tests/test_r1_data_only.py::test_forecast_rating_actual_computed_business_definition_and_templates
      - name: Verify actual BD pipeline behavior and fixed WFD readback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          export XUAN_TEST_ROOT="$RUNNER_TEMP/bd-pipeline-tests"
          export XUAN_FULL_CHAIN_ROOT="$RUNNER_TEMP/bd-pipeline-wfd"
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          "$BD_NODE" "$BD_NPM" run test:pipeline

      - name: Full Node regression and real WFD source-based tests
        if: runner.os == 'Linux' && github.event_name == 'workflow_dispatch' && inputs.full_regression
        shell: bash
        run: |
          export XUAN_TEST_ROOT="$RUNNER_TEMP/bd-full-tests"
          export XUAN_FULL_CHAIN_ROOT="$RUNNER_TEMP/bd-full-chain"
          export PYTHONPYCACHEPREFIX="$RUNNER_TEMP/bd-fresh-bytecode"
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          env -u WFD_PYTHON -u POLARS_PYTHON "$BD_NODE" "$BD_NPM" test
          "$BD_NODE" --import tsx --test modules/agent/*.test.ts
          "$BD_NODE" --import tsx --test modules/financial/*.test.ts apps/server/macd-full-chain.test.ts
          "$BD_NODE" "$BD_NPM" run test:python -- --python="$WFD_PYTHON"
      - name: Rebuild optional bundle and verify existing manifest consumer
        if: runner.os != 'Linux'
        shell: bash
        run: |
          python scripts/bootstrap-resources.py --profile bundle --output "$GITHUB_WORKSPACE/resources/bundled"
          "$BD_NODE" --import tsx -e "import {BundledResources} from './platform/resources/bundled.ts'; new BundledResources(process.cwd()).verify(); console.log('BUNDLE_MANIFEST_VERIFIED');"
      - name: Verify actual local transcription on the supported macOS bundle
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export XUAN_TEST_ROOT="$RUNNER_TEMP/bd-transcription-tests"
          export XUAN_FULL_CHAIN_ROOT="$RUNNER_TEMP/bd-transcription-chain"
          export XUAN_TEST_TRANSCRIPTION_BUNDLE="$GITHUB_WORKSPACE"
          export XUAN_TEST_TRANSCRIPTION_AUDIO="$RUNNER_TEMP/bd-public-jfk.wav"
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          python - <<'PYMEDIA'
          import hashlib, os, pathlib, urllib.request
          # Upstream MIT-licensed whisper.cpp sample; public JFK speech, not private media.
          # The already hash-locked bundle retains the upstream LICENSE.
          url = 'https://raw.githubusercontent.com/ggml-org/whisper.cpp/v1.9.1/samples/jfk.wav'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(2 * 1024 * 1024 + 1)
          assert len(data) == 352078, 'Unexpected public audio length'
          assert hashlib.sha256(data).hexdigest() == '59dfb9a4acb36fe2a2affc14bacbee2920ff435cb13cc314a08c13f66ba7860e', 'Public audio digest mismatch'
          with pathlib.Path(os.environ['XUAN_TEST_TRANSCRIPTION_AUDIO']).open('xb') as output:
              output.write(data)
          PYMEDIA
          "$BD_NODE" --import tsx --test --test-concurrency=1 --test-reporter=tap apps/server/local-transcription-live.test.ts apps/server/transcription-review-live.test.ts apps/server/transcription-review.test.ts apps/server/transcription-claim-live.test.ts apps/server/transcription-claim-contract.test.ts platform/capabilities/transcription/progress.test.ts platform/runtime/process-output.test.ts platform/runtime/file-workspace.test.ts platform/resources/direct-trusted-resources.test.ts | tee "$RUNNER_TEMP/bd-transcription-result.tap"
          grep -q '^# skipped 0$' "$RUNNER_TEMP/bd-transcription-result.tap"
      - name: Verify actual optional macOS Vision OCR with synthetic image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          export XUAN_TEST_ROOT="$RUNNER_TEMP/bd-vision-tests"
          export XUAN_FULL_CHAIN_ROOT="$RUNNER_TEMP/bd-vision-chain"
          export XUAN_TEST_VISION_OCR="$RUNNER_TEMP/bd-vision-ocr"
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          test ! -e "$XUAN_TEST_VISION_OCR"
          xcrun swiftc -O platform/capabilities/ocr/vision.swift -o "$XUAN_TEST_VISION_OCR" -framework Vision -framework ImageIO
          "$BD_NODE" --import tsx --test --test-concurrency=1 --test-reporter=tap apps/server/local-ocr-live.test.ts apps/server/ocr-review-live.test.ts apps/server/ocr-claim-live.test.ts apps/server/ocr-claim-contract.test.ts platform/capabilities/ocr/evidence.test.ts platform/capabilities/ocr/adapter.test.ts | tee "$RUNNER_TEMP/bd-vision-result.tap"
          grep -q '^# skipped 0$' "$RUNNER_TEMP/bd-vision-result.tap"
      - name: Reject tracked build outputs or changes to source
        shell: bash
        run: |
          "$BD_NODE" "$BD_NPM" run repo:check
          git diff --exit-code
