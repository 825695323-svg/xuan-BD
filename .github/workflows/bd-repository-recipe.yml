name: BD repository recipe verification
on:
  push:
    branches: [fix/bd-reproducible-recipe-20261112]
permissions:
  contents: read
concurrency:
  group: bd-recipe-inputs-${{ github.ref }}
  cancel-in-progress: true
jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Lock exact upstream downloads and Python wheels
        run: python3 scripts/lock-build-inputs.py --output "$RUNNER_TEMP/recipe-locks"
      - name: Lock existing browser daemon dependency graph
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --prefix resources/browser
          cp resources/browser/package-lock.json "$RUNNER_TEMP/recipe-locks/browser-package-lock.json"
          cp scripts/lock-build-inputs.py "$RUNNER_TEMP/recipe-locks/lock-build-inputs.py"
      - uses: actions/upload-artifact@v4
        with:
          name: recipe-locks
          path: ${{ runner.temp }}/recipe-locks
          retention-days: 1
          if-no-files-found: error
