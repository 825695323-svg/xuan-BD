name: Temporary exact history source transfer
on:
  push:
    branches: [feat/bd-history-read-boundaries]
    paths: ['.github/workflows/bd-history-transfer.yml']
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == '825695323-svg/xuan-BD' && github.ref == 'refs/heads/feat/bd-history-read-boundaries'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply only the locally validated source delta
        env:
          EXPECTED_TREE: 7f037a3820c3edb5a20a105f32ba63a93a06764b
        run: |
          test "$(git rev-parse HEAD^)" = ae64552ecefd598e11071db09ca9d85e8accf031
          python3 - <<'PY'
          import base64, hashlib, os, pathlib, subprocess, tempfile, zlib
          first = pathlib.Path('.github/history-transfer-1.bin').read_bytes()
          second = base64.b64encode(pathlib.Path('.github/history-transfer-2.bin').read_bytes()).decode()
          # Recover three verified transport transcription characters; the full patch digest and source tree are mandatory.
          for old, new in [('SC4V+VBy', 'SC4V+FWBy'), ('C98uHTpS9M34', 'C98uHTpS34'), ('nn7cuPpV9f57', 'nn7cuPpV/f57')]:
              assert second.count(old) == 1
              second = second.replace(old, new)
          patch = zlib.decompress(first + base64.b64decode(second))
          assert hashlib.sha256(patch).hexdigest() == '5c6dbebe2a39714d27ce9900dec4eb7682f9b64f247ee1fe47e3c71e59dd7997'
          subprocess.run(['git', 'apply', '--check', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '--index', '-'], input=patch, check=True)
          subprocess.run(['git', 'rm', '.github/history-transfer-1.bin', '.github/history-transfer-2.bin'], check=True)
          expected = ['apps/server/r1-history-read.test.ts', 'contracts/r1-contracts.ts', 'docs/SOURCE-SEMANTIC-ADOPTION.md', 'modules/collection/r1-product-reader.test.ts', 'modules/collection/r1-product-reader.ts', 'modules/financial/product-machine-snapshot.test.ts', 'modules/financial/product-machine-snapshot.ts']
          changed = subprocess.check_output(['git', 'diff', '--cached', '--name-only', '--diff-filter=AM'], text=True).splitlines()
          assert sorted(changed) == expected, changed
          staged_tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          with tempfile.TemporaryDirectory() as directory:
              env = dict(os.environ, GIT_INDEX_FILE=str(pathlib.Path(directory) / 'index'))
              subprocess.run(['git', 'read-tree', staged_tree], env=env, check=True)
              subprocess.run(['git', 'update-index', '--force-remove', '.github/workflows/bd-history-transfer.yml'], env=env, check=True)
              actual = subprocess.check_output(['git', 'write-tree'], env=env, text=True).strip()
              assert actual == os.environ['EXPECTED_TREE'], actual
              print('Verified exact tested source tree:', actual)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat(BD): bind historical reads to explicit cutoff and actual holding-stage evidence'
          git push origin HEAD:refs/heads/feat/bd-history-read-boundaries
