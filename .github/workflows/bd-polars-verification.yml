name: BD unified Polars independent verification

on:
  push:
    branches: [refactor/unified-polars-verification]
  pull_request:
    paths:
      - 'modules/collection/data-processing/polars-fixed.ts'
      - 'modules/collection/data-processing/polars-macro-independent.test.ts'
      - 'modules/collection/polars-fixed-service.ts'
      - '.github/workflows/bd-polars-verification.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Independent Polars and macro WFD evidence checks
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/polars-independent
        run: |
          mkdir -p "$XUAN_TEST_ROOT"
          node --import tsx --test \
            modules/collection/data-processing/polars-macro-independent.test.ts \
            modules/collection/data-processing/financial-fixed.test.ts \
            modules/collection/polars-eligibility-gate.test.ts
