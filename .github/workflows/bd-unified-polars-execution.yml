name: BD unified algorithm Polars execution

on:
  push:
    branches: [main]
    paths:
      - 'modules/financial/unified-polars-execution.ts'
      - 'modules/financial/wfd-source-ma*.ts'
      - 'modules/collection/data-processing/polars-fixed.ts'
      - 'modules/financial/unified-polars-derived.ts'
      - 'modules/financial/basic-algorithm-tool-contract.ts'
      - 'modules/collection/production-calculation*.ts'
      - 'modules/collection/polars-cleaning.test.ts'
      - 'modules/collection/data-processing/polars-clean*'
      - 'modules/collection/data-processing/polars-structure-worker.py'
      - 'modules/collection/production-verifier*.ts'
      - 'modules/collection/processing-plan.ts'
      - 'modules/collection/production-module-*.ts'
      - 'modules/collection/conversation-processing.ts'
      - 'modules/financial/algorithm-definitions.ts'
      - 'modules/financial/algorithm-registry.ts'
      - 'modules/agent/model-tools.ts'
      - 'modules/collection/candidate-pipeline.ts'
      - 'modules/financial/conversation-algorithms.ts'
      - 'modules/financial/basic-algorithm-tool-contract.ts'
      - 'apps/server/services.ts'
      - 'contracts/workspace-services.ts'
      - '.github/workflows/bd-unified-polars-execution.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/financial/unified-polars-execution.ts'
      - 'modules/collection/production-calculation*.ts'
      - 'modules/collection/production-verifier*.ts'
      - 'modules/collection/processing-plan.ts'
      - 'modules/collection/production-module-*.ts'
      - 'modules/collection/conversation-processing.ts'
      - 'modules/financial/algorithm-definitions.ts'
      - 'modules/financial/algorithm-registry.ts'
      - 'modules/agent/model-tools.ts'
      - 'modules/collection/candidate-pipeline.ts'
      - 'modules/financial/conversation-algorithms.ts'
      - 'apps/server/services.ts'
      - 'contracts/workspace-services.ts'
      - '.github/workflows/bd-unified-polars-execution.yml'

permissions:
  contents: read

concurrency:
  group: bd-unified-polars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exactly pinned Polars worker
        run: |
          python -m pip install -r config/polars-requirements.txt -r wfd/product/requirements-duckdb.txt
          echo "POLARS_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "WFD_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Typecheck and frontend production build
        run: npm run build
      - name: Test unified task route and existing Polars verifiers
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/bd-unified-polars-tests
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/bd-unified-polars-live
        run: |
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          node --import tsx --test \
            modules/financial/unified-polars-execution.test.ts \
            modules/financial/unified-polars-derived.test.ts \
            modules/financial/unified-polars-r1-gate.test.ts \
            modules/financial/unified-polars-live.test.ts \
            modules/financial/unified-algorithm-discovery.test.ts \
            modules/collection/data-processing/polars-macro-independent.test.ts \
            modules/collection/data-processing/financial-fixed.test.ts \
            apps/server/unified-polars-publish-full-chain.test.ts \
            modules/collection/production-calculation.test.ts \
            modules/collection/production-module-ports.test.ts \
            modules/collection/production-module-discovery.test.ts \
            modules/collection/production-verifier.test.ts \
            modules/collection/polars-cleaning.test.ts

      - name: Financial module test coverage outside default npm test
        if: ${{ !cancelled() }}
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/bd-financial-module-tests
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/bd-financial-full-chain
        run: |
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          node --import tsx --test modules/financial/*.test.ts
      - name: Check legacy R1 and Polars admission compatibility
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/bd-regression-legacy-tests
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/bd-regression-legacy-chain
        run: |
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          # Legacy route regressions exercise only local HTTP; the separate WFD full-chain step above
          # explicitly supplies WFD_PYTHON and validates actual remote publishing/readback.
          env -u WFD_PYTHON -u POLARS_PYTHON node --import tsx --test apps/server/r1-routes.test.ts
          node --import tsx --test modules/collection/polars-financial-admission.test.ts
      - name: Full native Node and TypeScript regression (failures remain visible)
        if: ${{ !cancelled() }}
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/bd-unified-full-tests
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/bd-unified-full-chain
        run: |
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          # Runtime-only suites already run with explicit WFD_PYTHON/POLARS_PYTHON above.
          # Default full suite keeps the fixture-less environment of scripts/test-local.mjs.
          env -u WFD_PYTHON -u POLARS_PYTHON npm test
