name: BD material processing and R1 verification

on:
  push:
    branches: [main]
    paths:
      - 'modules/collection/production-module-ports*.ts'
      - 'modules/collection/conversation-processing.ts'
      - 'modules/agent/model-tools.ts'
      - 'modules/collection/polars-cleaning.test.ts'
      - 'modules/collection/data-processing/polars-clean*'
      - 'modules/collection/data-processing/polars-structure-worker.py'
      - 'modules/collection/production-verifier*.ts'
      - 'modules/collection/processing-plan.ts'
      - 'modules/collection/r1-auto-batch.ts'
      - 'modules/collection/r1-structured-handoff.ts'
      - 'modules/collection/post-publication-correction.ts'
      - 'apps/server/continuous-correction.test.ts'
      - 'apps/server/full-chain-test-support.ts'
      - 'wfd/product/**'
      - 'modules/collection/candidate-pipeline.ts'
      - 'apps/server/services.ts'
      - '.github/workflows/bd-unified-polars-execution.yml'
  workflow_dispatch:
    inputs:
      full_regression:
        description: 'Run the optional full Linux Node/TypeScript regression'
        type: boolean
        required: false
        default: false
  pull_request:
    paths:
      - 'modules/collection/production-verifier*.ts'
      - 'modules/collection/processing-plan.ts'
      - 'modules/collection/r1-auto-batch.ts'
      - 'modules/collection/r1-structured-handoff.ts'
      - 'modules/collection/post-publication-correction.ts'
      - 'apps/server/continuous-correction.test.ts'
      - 'apps/server/full-chain-test-support.ts'
      - 'wfd/product/**'
      - 'modules/collection/candidate-pipeline.ts'
      - 'apps/server/services.ts'
      - 'contracts/workspace-services.ts'
      - '.github/workflows/bd-unified-polars-execution.yml'

permissions:
  contents: read

concurrency:
  group: bd-unified-polars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Select continuous correction impact
        id: correction
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # PR checkout is the merge commit; push selection must include every pushed commit.
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"; exit 0
          fi
          base=HEAD^
          if [ "$EVENT_NAME" = push ]; then
            base="$PUSH_BEFORE"
            if ! git fetch --no-tags --depth=1 origin "$base"; then
              echo 'selected=true' >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          if ! changed="$(git diff --name-only "$base" HEAD)"; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"; exit 0
          fi
          if grep -Eq '^(modules/collection/(processing-plan|r1-auto-batch|r1-structured-handoff|post-publication-correction)\.ts|apps/server/(continuous-correction\.test|full-chain-test-support|services)\.ts|wfd/product/|\.github/workflows/bd-unified-polars-execution\.yml)' <<< "$changed"; then
            echo 'selected=true' >> "$GITHUB_OUTPUT"
          else
            echo 'selected=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exactly pinned Polars worker
        run: |
          python -m pip install -r config/polars-requirements.txt -r wfd/product/requirements-duckdb.txt
          echo "POLARS_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "WFD_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Typecheck and frontend production build
        run: npm run build
      - name: Verify material processing and Polars cleaning
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/bd-unified-polars-tests
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/bd-unified-polars-live
        run: |
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          node --import tsx --test \
            modules/collection/data-processing/financial-fixed.test.ts \
            modules/collection/production-verifier.test.ts \
            modules/collection/polars-cleaning.test.ts \
            modules/collection/production-module-ports.test.ts

      - name: Verify local R1 routes
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/bd-regression-legacy-tests
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/bd-regression-legacy-chain
        run: |
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          env -u WFD_PYTHON -u POLARS_PYTHON node --import tsx --test apps/server/r1-routes.test.ts
      - name: Verify continuous publication and source correction with real WFD
        if: steps.correction.outputs.selected == 'true'
        env:
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/bd-continuous-correction
        run: |
          test -n "$WFD_PYTHON" && test -x "$WFD_PYTHON"
          mkdir -p "$XUAN_FULL_CHAIN_ROOT"
          node --import tsx --test apps/server/continuous-correction.test.ts

      - name: Full native Node and TypeScript regression (failures remain visible)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.full_regression }}
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/bd-unified-full-tests
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/bd-unified-full-chain
        run: |
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          # Explicit opt-in only. Focused processing and R1 tests above remain enabled.
          env -u WFD_PYTHON -u POLARS_PYTHON npm test
