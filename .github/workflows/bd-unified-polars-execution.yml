name: BD material processing and R1 verification

on:
  push:
    branches: [main]
    paths:
      - 'modules/collection/production-module-ports*.ts'
      - 'modules/collection/conversation-processing.ts'
      - 'modules/agent/model-tools.ts'
      - 'modules/collection/polars-cleaning.test.ts'
      - 'modules/collection/data-processing/polars-clean*'
      - 'modules/collection/data-processing/polars-structure-worker.py'
      - 'modules/collection/production-verifier*.ts'
      - 'modules/collection/processing-plan.ts'
      - 'modules/collection/candidate-pipeline.ts'
      - 'apps/server/services.ts'
      - '.github/workflows/bd-unified-polars-execution.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'modules/collection/production-verifier*.ts'
      - 'modules/collection/processing-plan.ts'
      - 'modules/collection/candidate-pipeline.ts'
      - 'apps/server/services.ts'
      - 'contracts/workspace-services.ts'
      - '.github/workflows/bd-unified-polars-execution.yml'

permissions:
  contents: read

concurrency:
  group: bd-unified-polars-${{ github.ref }}
  cancel-in-progress: true

jobs:
  execution:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install pinned dependencies
        run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exactly pinned Polars worker
        run: |
          python -m pip install -r config/polars-requirements.txt -r wfd/product/requirements-duckdb.txt
          echo "POLARS_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          echo "WFD_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Typecheck and frontend production build
        run: npm run build
      - name: Verify material processing and Polars cleaning
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/bd-unified-polars-tests
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/bd-unified-polars-live
        run: |
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          node --import tsx --test \
            modules/collection/data-processing/financial-fixed.test.ts \
            modules/collection/production-verifier.test.ts \
            modules/collection/polars-cleaning.test.ts \
            modules/collection/production-module-ports.test.ts

      - name: Verify local R1 routes
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/bd-regression-legacy-tests
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/bd-regression-legacy-chain
        run: |
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          env -u WFD_PYTHON -u POLARS_PYTHON node --import tsx --test apps/server/r1-routes.test.ts
      - name: Full native Node and TypeScript regression (failures remain visible)
        if: ${{ !cancelled() }}
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/bd-unified-full-tests
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/bd-unified-full-chain
        run: |
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          # Runtime-only suites already run with explicit WFD_PYTHON/POLARS_PYTHON above.
          # Default full suite keeps the fixture-less environment of scripts/test-local.mjs.
          env -u WFD_PYTHON -u POLARS_PYTHON npm test
