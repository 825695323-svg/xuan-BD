name: BD official public API focused probes

on:
  pull_request:
    paths:
      - 'scripts/probe-official-apis.py'
      - 'plugins/api-sources/official-public*.ts'
      - 'apps/server/official-public*.test.ts'
      - 'contracts/source-acquisition.ts'
      - 'plugins/api-sources/source-acquisition.ts'
      - '.github/workflows/bd-official-api-probes.yml'
  workflow_dispatch:
    inputs:
      live:
        description: 'Explicitly authorize up to seven no-key official API reads'
        type: boolean
        default: false
        required: false

permissions:
  contents: read
concurrency:
  group: bd-official-public-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locked build and repository checks
        run: |
          npm ci
          npm run repo:check
          npm run build
      - name: Live official reads only for this authorized feature or explicit manual choice
        if: github.head_ref == 'feat/bd-official-api-samples' || (github.event_name == 'workflow_dispatch' && inputs.live)
        run: python scripts/probe-official-apis.py --output "$RUNNER_TEMP/bd-official-live"
      - name: Preserve bounded public raw responses and honest failures
        if: always() && (github.head_ref == 'feat/bd-official-api-samples' || (github.event_name == 'workflow_dispatch' && inputs.live))
        uses: actions/upload-artifact@v4
        with:
          name: bd-official-public-samples
          path: ${{ runner.temp }}/bd-official-live/
          retention-days: 3
          if-no-files-found: warn
