name: BD unified WFD fixed record selection

on:
  push:
    branches: [refactor/unified-algorithm-fixed-read]
  pull_request:
    paths:
      - 'modules/collection/data-processing/wfd-fixed-selection*'
      - 'modules/collection/data-processing/financial-fixed.ts'
      - '.github/workflows/bd-unified-fixed-read.yml'

permissions:
  contents: read

jobs:
  fixed-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Check full TS build and frontend
        run: npm run build
      - name: Verify fixed WFD selection and financial source mapping
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/fixed-selection
        run: |
          mkdir -p "$XUAN_TEST_ROOT"
          node --import tsx --test \
            modules/collection/data-processing/wfd-fixed-selection.test.ts \
            modules/collection/data-processing/financial-fixed.test.ts
