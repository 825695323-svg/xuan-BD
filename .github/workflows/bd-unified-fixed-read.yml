name: BD unified WFD fixed record selection

on:
  push:
    branches: [refactor/unified-algorithm-fixed-read]
  pull_request:
    paths:
      - 'modules/collection/data-processing/wfd-fixed-selection*'
      - 'modules/collection/data-processing/financial-fixed.ts'
      - 'modules/financial/**'
      - 'apps/server/macd-full-chain.test.ts'
      - 'contracts/algorithm-definition.ts'
      - 'contracts/r1-contracts.ts'
      - 'modules/collection/r1-product-reader*'
      - 'apps/server/r1-history-read.test.ts'
      - 'apps/server/financial-compatible-inputs.test.ts'
      - '.github/workflows/bd-unified-fixed-read.yml'

permissions:
  contents: read

jobs:
  fixed-inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select affected fixed-read contracts
        id: scope
        run: |
          changed="$(git diff --name-only HEAD^ HEAD)"
          if echo "$changed" | grep -Eq '(modules/financial/|macd-full-chain|contracts/algorithm-definition|bd-unified-fixed-read)'; then
            echo 'algorithm=true' >> "$GITHUB_OUTPUT"
          else
            echo 'algorithm=false' >> "$GITHUB_OUTPUT"
          fi
          if echo "$changed" | grep -Eq '(r1-product-reader|r1-history-read|financial-fixed|financial-compatible-inputs|wfd-fixed-selection|contracts/r1-contracts|product-machine-snapshot|bd-unified-fixed-read)'; then
            echo 'history=true' >> "$GITHUB_OUTPUT"
          else
            echo 'history=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci
      - name: Check full TS build and frontend
        run: npm run build
      - name: Verify fixed WFD selection and financial source mapping
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/fixed-selection
        run: |
          mkdir -p "$XUAN_TEST_ROOT"
          node --import tsx --test \
            modules/collection/data-processing/wfd-fixed-selection.test.ts \
            modules/collection/data-processing/financial-fixed.test.ts
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.algorithm == 'true' || steps.scope.outputs.history == 'true'
        with:
          python-version: '3.12'
      - name: Install hash-locked WFD requirements for selected fixed-read tests
        if: steps.scope.outputs.algorithm == 'true' || steps.scope.outputs.history == 'true'
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r config/local-web-python.lock.txt
          echo "WFD_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Verify semantic identity, frozen recovery and real MACD WFD replay
        if: steps.scope.outputs.algorithm == 'true'
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/macd-contract-tests
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/macd-wfd-tests
        run: |
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          node --import tsx --test \
            modules/financial/derived-wfd-check.test.ts \
            modules/financial/algorithm-purpose-eligibility.test.ts \
            modules/financial/product-machine-snapshot.test.ts \
            apps/server/macd-full-chain.test.ts
      - name: Verify explicit historical reads and stage-bound input over HTTP and WFD
        if: steps.scope.outputs.history == 'true'
        env:
          XUAN_TEST_ROOT: ${{ runner.temp }}/history-contract-tests
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/history-wfd-tests
        run: |
          mkdir -p "$XUAN_TEST_ROOT" "$XUAN_FULL_CHAIN_ROOT"
          PYTHONPATH=wfd/product python -m pytest -q wfd/product/tests/test_definition_publication_binding.py
          node --import tsx --test \
            modules/collection/r1-product-reader.test.ts \
            apps/server/r1-history-read.test.ts \
            apps/server/financial-compatible-inputs.test.ts
