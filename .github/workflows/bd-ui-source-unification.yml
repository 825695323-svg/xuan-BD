name: BD shared UI contracts and source routing

on:
  pull_request:
    paths:
      - 'apps/web/src/**'
      - 'apps/web/visual-audit.html'
      - 'scripts/visual-ui-audit.mjs'
      - 'apps/server/source-settings-routes.ts'
      - 'apps/server/workspace-routes.ts'
      - 'apps/server/logic-cleanup.test.ts'
      - 'apps/server/r1-routes.test.ts'
      - 'apps/server/r1-history-browser.test.ts'
      - 'apps/server/relation-history-browser.test.ts'
      - 'apps/server/event-history-browser.test.ts'
      - 'apps/server/filter-history-browser.test.ts'
      - 'apps/server/joint-history-browser.test.ts'
      - 'apps/server/object-selection-browser.test.ts'
      - 'apps/server/task-center-browser.test.ts'
      - 'apps/server/task-recovery-browser.test.ts'
      - 'apps/server/correction-cases-browser.test.ts'
      - 'apps/server/r1-plan-review-http.test.ts'
      - 'apps/server/configured-app.ts'
      - 'apps/server/ui-routes.ts'
      - 'apps/server/attachment-upload.ts'
      - 'contracts/r1-contracts.ts'
      - 'contracts/r1-publication-set.ts'
      - 'modules/collection/r1-workspace.ts'
      - 'modules/collection/r1-structured-handoff.ts'
      - 'modules/collection/r1-paged-readback.ts'
      - 'modules/collection/processing-plan.ts'
      - 'contracts/source-settings.ts'
      - 'contracts/source-acquisition.ts'
      - 'contracts/contracts.ts'
      - 'contracts/upload-limits.ts'
      - 'modules/collection/accept-material.ts'
      - 'modules/collection/production-module-ports.ts'
      - 'modules/financial/**'
      - 'scripts/logic-maintenance-check.mjs'
      - 'scripts/logic-maintenance-check.test.mjs'
      - 'docs/逻辑维护与历史兼容边界.md'
      - 'modules/collection/r1-auto-batch.ts'
      - 'platform/config/source-settings.ts'
      - 'plugins/api-sources/**'
      - '.github/workflows/bd-ui-source-unification.yml'
      - 'docs/前端界面与复用组件规范.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select the affected R1 review tests
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          changed="$(git diff --name-only HEAD^ HEAD)"
          if [ "$EVENT_NAME" = workflow_dispatch ] || echo "$changed" | grep -Eq '(CorrectionCases|correction-cases|TaskRecovery|task-recovery|TaskCenter|useConversationTasks|task-center-browser|object-reference|workspace-context|App\.tsx|ObjectDetailPanel|WorkspaceLayout|ApiSourcesPage|ToolsPage|CaptureSourcesPage|useStoredSelection|object-selection-browser|r1-joint-history|joint-history-browser|r1-filter-history|filter-history-browser|r1-read-history|r1-context-history|StructuredQueryPanel|structured-query-api|R1ReadPanel|R1SingleOutputPanel|R1Panel\.css|r1-api|r1-history-browser|relation-history-browser|event-history-browser|bd-ui-source-unification)'; then
            echo 'history=true' >> "$GITHUB_OUTPUT"
          else
            echo 'history=false' >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT_NAME" = workflow_dispatch ] || echo "$changed" | grep -Eq '(r1-plan-review|R1PlanReview|R1Panel|R1SingleOutputPanel|contracts/r1-contracts|r1-publication-set|r1-workspace|r1-structured-handoff|r1-paged-readback|processing-plan)'; then
            echo 'r1=true' >> "$GITHUB_OUTPUT"
          else
            echo 'r1=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source recipe and production typecheck/build
        run: |
          npm run repo:check
          npm run build
      - name: Check cleaned modules for unused declarations
        run: |
          node --test scripts/logic-maintenance-check.test.mjs
          node scripts/logic-maintenance-check.mjs
      - name: Verify source routing, request safety and reusable UI contracts
        run: |
          node --import tsx --test \
            plugins/api-sources/source-routing.test.ts \
            plugins/api-sources/source-acquisition.test.ts \
            apps/web/src/ui/sourceSettingsClient.test.ts \
            apps/web/src/ui/PageUI.test.tsx \
            apps/web/src/r1-read-history.test.ts \
            apps/web/src/r1-context-history.test.ts \
            apps/web/src/r1-filter-history.test.ts \
            apps/web/src/r1-joint-history.test.ts \
            apps/web/src/useConversationTasks.test.tsx \
            apps/web/src/task-recovery.test.ts \
            apps/web/src/correction-cases-api.test.ts \
            apps/web/src/object-reference-evidence.test.ts \
            apps/web/src/object-reference.test.ts \
            apps/web/src/object-reference-draft.test.ts \
            apps/web/src/ui/logic-cleanup.test.tsx \
            apps/server/logic-cleanup.test.ts \
            modules/collection/production-module-ports.test.ts
      - name: Verify stepwise AGENTS feedback
        run: |
          node --import tsx --test --test-name-pattern='AGENTS iterative parse feedback' modules/collection/r1-conversation-bridge.test.ts
      - name: Verify the affected R1 review and confirmation contracts
        if: steps.scope.outputs.r1 == 'true'
        run: node --import tsx --test apps/web/src/ui/r1-plan-review.test.ts
      - uses: actions/setup-python@v5
        if: steps.scope.outputs.r1 == 'true' || steps.scope.outputs.history == 'true'
        with:
          python-version: '3.12'
      - name: Prepare isolated WFD and explicit test browser bindings
        if: steps.scope.outputs.r1 == 'true' || steps.scope.outputs.history == 'true'
        run: |
          python -m pip install -r wfd/product/requirements-duckdb.txt
          echo "WFD_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium)"
          test -n "$chrome"
          chrome="$(readlink -f "$chrome")"
          sha256sum "$chrome"
          # Ephemeral CI-only launcher, no personal browser profile or production settings.
          launcher="$RUNNER_TEMP/r1-review-chrome"
          printf '#!/usr/bin/env bash\nexec "%s" --no-sandbox --disable-dev-shm-usage "$@"\n' "$chrome" > "$launcher"
          chmod 700 "$launcher"
          echo "XUAN_TEST_BROWSER=$launcher" >> "$GITHUB_ENV"
          echo "XUAN_TEST_BROWSER_SHA256=$(sha256sum "$launcher" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Install CJK glyph coverage for readable screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fc-cache -f
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk
          fc-match -f '%{family}\n' :lang=zh-cn
      - name: Verify actual multi-output review over HTTP and WFD, with an isolated browser
        if: steps.scope.outputs.r1 == 'true'
        env:
          # Short isolated parent avoids Chromium's Unix-domain socket length limit.
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/r
          XUAN_TEST_ROOT: ${{ runner.temp }}/r1-review-tests
          XUAN_REVIEW_VISUAL_ROOT: ${{ runner.temp }}/xuan-bd-ui-visual/r1-review
        run: |
          mkdir -p "$XUAN_FULL_CHAIN_ROOT" "$XUAN_TEST_ROOT"
          node --import tsx --test apps/server/r1-plan-review-http.test.ts
      - name: Verify actual history and object selection in the React UI and bound services
        if: steps.scope.outputs.history == 'true'
        env:
          XUAN_FULL_CHAIN_ROOT: ${{ runner.temp }}/h
          XUAN_TEST_ROOT: ${{ runner.temp }}/r1-history-tests
          XUAN_HISTORY_VISUAL_ROOT: ${{ runner.temp }}/xuan-bd-ui-visual/r1-history
          XUAN_CORRECTION_VISUAL_ROOT: ${{ runner.temp }}/xuan-bd-ui-visual/correction-cases
          XUAN_TASK_VISUAL_ROOT: ${{ runner.temp }}/xuan-bd-ui-visual/task-center
          XUAN_OBJECT_VISUAL_ROOT: ${{ runner.temp }}/xuan-bd-ui-visual/object-selection
          XUAN_JOINT_VISUAL_ROOT: ${{ runner.temp }}/xuan-bd-ui-visual/joint-history
          XUAN_FILTER_VISUAL_ROOT: ${{ runner.temp }}/xuan-bd-ui-visual/filter-history
          XUAN_EVENT_VISUAL_ROOT: ${{ runner.temp }}/xuan-bd-ui-visual/event-history
          XUAN_RELATION_VISUAL_ROOT: ${{ runner.temp }}/xuan-bd-ui-visual/relation-history
        run: |
          mkdir -p "$XUAN_FULL_CHAIN_ROOT" "$XUAN_TEST_ROOT"
          set -euo pipefail
          export XUAN_TEST_WEB_ROOT="$GITHUB_WORKSPACE/dist/web"
          node --import tsx --test --test-concurrency=1 --test-reporter=tap apps/server/r1-history-browser.test.ts apps/server/relation-history-browser.test.ts apps/server/event-history-browser.test.ts apps/server/filter-history-browser.test.ts apps/server/joint-history-browser.test.ts apps/server/object-selection-browser.test.ts apps/server/task-center-browser.test.ts apps/server/task-recovery-browser.test.ts apps/server/correction-cases-browser.test.ts | tee "$RUNNER_TEMP/r1-history.tap"
          grep -q '^# fail 0$' "$RUNNER_TEMP/r1-history.tap"
          grep -q '^# skipped 0$' "$RUNNER_TEMP/r1-history.tap"
      - name: Browser geometry and screenshot visual audit
        run: node scripts/visual-ui-audit.mjs
      - name: Retain visual screenshots and DOM measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bd-ui-visual-snapshots
          path: ${{ runner.temp }}/xuan-bd-ui-visual/
          if-no-files-found: warn
          retention-days: 7
