name: BD shared UI contracts and source routing

on:
  pull_request:
    paths:
      - 'apps/web/src/**'
      - 'apps/web/visual-audit.html'
      - 'scripts/visual-ui-audit.mjs'
      - 'apps/server/source-settings-routes.ts'
      - 'apps/server/algorithm-routes.ts'
      - 'apps/server/workspace-routes.ts'
      - 'apps/server/logic-cleanup.test.ts'
      - 'apps/server/r1-routes.test.ts'
      - 'apps/server/polars-fixed.test.ts'
      - 'apps/server/configured-app.ts'
      - 'apps/server/ui-routes.ts'
      - 'apps/server/attachment-upload.ts'
      - 'contracts/source-settings.ts'
      - 'contracts/contracts.ts'
      - 'contracts/upload-limits.ts'
      - 'modules/collection/accept-material.ts'
      - 'modules/collection/production-module-ports.ts'
      - 'modules/financial/**'
      - 'scripts/logic-maintenance-check.mjs'
      - 'scripts/logic-maintenance-check.test.mjs'
      - 'docs/逻辑维护与历史兼容边界.md'
      - 'modules/collection/r1-auto-batch.ts'
      - 'platform/config/source-settings.ts'
      - 'plugins/api-sources/**'
      - '.github/workflows/bd-ui-source-unification.yml'
      - 'docs/前端界面与复用组件规范.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify source recipe and production typecheck/build
        run: |
          npm run repo:check
          npm run build
      - name: Check cleaned modules for unused declarations
        run: |
          node --test scripts/logic-maintenance-check.test.mjs
          node scripts/logic-maintenance-check.mjs
      - name: Verify source routing, request safety and reusable UI contracts
        run: |
          node --import tsx --test \
            plugins/api-sources/source-routing.test.ts \
            apps/web/src/ui/sourceSettingsClient.test.ts \
            apps/web/src/ui/PageUI.test.tsx \
            apps/web/src/ui/logic-cleanup.test.tsx \
            apps/server/logic-cleanup.test.ts \
            modules/financial/basic-algorithm-tool-contract.test.ts \
            modules/financial/unified-algorithm-discovery.test.ts \
            modules/collection/production-module-ports.test.ts
      - name: Verify retired HTTP creation and stepwise AGENTS feedback
        run: |
          node --import tsx --test --test-name-pattern='fixed calculation HTTP' apps/server/r1-routes.test.ts
          node --import tsx --test --test-name-pattern='AGENTS iterative parse feedback' modules/collection/r1-conversation-bridge.test.ts
      - name: Install CJK glyph coverage for readable screenshots
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends fonts-noto-cjk
          fc-cache -f
          dpkg-query -W -f='${Package} ${Version}\n' fonts-noto-cjk
          fc-match -f '%{family}\n' :lang=zh-cn
      - name: Browser geometry and screenshot visual audit
        run: node scripts/visual-ui-audit.mjs
      - name: Retain visual screenshots and DOM measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bd-ui-visual-snapshots
          path: ${{ runner.temp }}/xuan-bd-ui-visual/
          if-no-files-found: warn
          retention-days: 7
